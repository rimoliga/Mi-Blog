<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<link rel="alternate" type="application/rss+xml" title="{{ .Site.Title }}" href="{{ .Site.BaseURL }}index.xml">
<link rel="me" href="https://blog.gabi.net.ar/">
<style>
  :root {
    --bg: #0f1117;
    --surface: #1e2130;
    --text: #e2e8f0;
    --text-muted: #8892a4;
    --link: #7cb9ff;
    --border: #2d3347;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { background: var(--bg); }
  body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; color: var(--text); background: var(--bg); }
  a { color: var(--link); }
  a:visited { color: #a78bfa; }
  h1, h2 { font-weight: 700; }
  time { color: var(--text-muted); font-size: .9em; }
  .h-card { display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem; padding: 1rem; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; }
  .h-card img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; }
  nav { margin-bottom: 2rem; }
  nav a { margin-right: 1rem; }
  hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
  code { background: var(--surface); padding: .15em .4em; border-radius: 3px; font-size: .9em; }
  pre { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 1rem; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  blockquote { border-left: 3px solid var(--border); margin: 0; padding-left: 1rem; color: var(--text-muted); }
  footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--border); color: var(--text-muted); font-size: .9em; }
</style>
