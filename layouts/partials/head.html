<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<link rel="alternate" type="application/rss+xml" title="{{ .Site.Title }}" href="{{ .Site.BaseURL }}index.xml">
<link rel="me" href="https://blog.gabi.net.ar/">
<style>
  body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; color: #222; }
  a { color: #0066cc; }
  h1, h2 { font-weight: 700; }
  time { color: #666; font-size: .9em; }
  .h-card { display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem; padding: 1rem; background: #f5f5f5; border-radius: 6px; }
  .h-card img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; }
  nav { margin-bottom: 2rem; }
  nav a { margin-right: 1rem; }
</style>
